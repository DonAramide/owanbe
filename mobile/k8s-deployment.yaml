apiVersion: apps/v1
kind: Deployment
metadata:
  name: owanbe-mobile-web
  labels:
    app: owanbe-mobile-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: owanbe-mobile-web
  template:
    metadata:
      labels:
        app: owanbe-mobile-web
    spec:
      containers:
      - name: owanbe-mobile-web
        image: gcr.io/owanbe-production/owanbe-mobile-web:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: owanbe-mobile-web-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: owanbe-mobile-web
